# Spell-checking config for https://github.com/crate-ci/typos.
#
# Run with `cargo make typos`. CI runs it from `.github/workflows/spelling.yml` rather than as a
# job in `ci.yml`, because that workflow has `paths-ignore: "**.md"` and prose typos live in
# markdown.

[files]
extend-exclude = [
  # Verbatim third-party NES reference documents. These are archived copies of nesdev/community
  # docs that PPU/APU/mapper comments quote and cite; correcting their spelling would make them
  # stop matching the originals.
  "docs/",
  # Generated from commit messages by git-cliff (`cliff.toml`). Rewriting history's spelling would
  # desync the changelog from the commits it is generated from.
  "CHANGELOG.md",
  # Data blobs: ROM names, board names and binary palettes, none of which are prose.
  "tetanes-core/game_database.txt",
  "tetanes-core/test_roms/",
]

[default.extend-words]
# 6502 opcodes.
ANC = "ANC"
SHS = "SHS"
CPY = "CPY"
# File extension for save states.
sav = "sav"
# `PNGs` splits into `PN` + `Gs` on the case boundary.
PN = "PN"
# profiler mod VirtuaNES splits on the case boundary.
Virtua = "Virtua"
# Romanized Chinese in a ROM title ("San Guo Zhi 2 - Ba Wang de Da Lu").
Ba = "Ba"
# Romanized Japanese in a ROM title ("Famicom Jump II - Saikyou no 7 Nin").
Nin = "Nin"
# iNES, the ROM container format.
ines = "ines"
