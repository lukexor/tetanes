[package]
name = "tetanes-core"
# Versioned apart from the workspace, which is the `tetanes` application's release line.
version = "0.19.0"
rust-version = "1.88.0"
edition.workspace = true
license.workspace = true
description = "A NES Emulator written in Rust"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["emulators"]
keywords = ["nes", "emulator"]

# No wasm32 target: `getrandom` needs its `wasm_js` feature, which only the final application can
# enable, so a docs.rs build of this crate alone fails there.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "clock_frame"
harness = false

[lints]
workspace = true

[features]
default = []
profiling = []
trace = []

[dependencies]
bincode.workspace = true
bitflags = { version = "2.10", features = ["serde"] }
cfg-if.workspace = true
dirs.workspace = true
flate2 = "1.0"
rand = "0.10"
rmp-serde.workspace = true
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64.workspace = true
serde_json.workspace = true
web-time.workspace = true
web-sys = { workspace = true, features = ["Storage", "Window"] }

[dev-dependencies]
anyhow.workspace = true
image.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
