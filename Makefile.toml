[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
reduce_output = false
skip_core_tasks = true
default_to_workspace = false

[tasks.default]
alias = "run"

[tasks.version]
description = "Print the crate version"
category = "Tools"
script = ["echo Version: ${CARGO_MAKE_PROJECT_VERSION}"]

[tasks.clean]
description = "Clean up build artifacts"
category = "Development"
command = "cargo"
args = ["clean"]

[tasks.check-fmt]
description = "Check format"
category = "Development"
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.typos]
description = "Check spelling"
category = "Development"
install_crate = { crate_name = "typos-cli", binary = "typos", test_arg = "--version" }
command = "typos"
args = ["${@}"]

[tasks.lint-web]
description = "Lint TetaNES Web"
category = "Development"
command = "cargo"
args = ["clippy", "--locked", "-p", "tetanes", "--lib", "--bin", "tetanes", "--target", "wasm32-unknown-unknown", "--all-features", "--keep-going"]
dependencies = ["add-wasm-target"]

[tasks.lint]
description = "Lint TetaNES"
category = "Development"
command = "cargo"
args = ["clippy", "--locked", "--all-features", "--keep-going"]
dependencies = ["typos", "lint-web"]

[tasks.pgo-profile]
description = "Run benchmark to generate PGO profile"
category = "Build"
command = "cargo"
args = ["pgo", "bench", "--", "--bench", "clock_frame"]

[tasks.pgo-build]
description = "Optimize TetaNES with PGO"
category = "Build"
command = "cargo"
args = ["pgo", "optimize", "build", "--", "-p", "tetanes", "${@}"]

[tasks.build]
description = "Build TetaNES with PGO"
category = "Build"
dependencies = ["pgo-profile", "pgo-build"]

[tasks.build-artifacts]
description = "Build TetaNES Artifacts for a given target_arch"
category = "Build"
command = "cargo"
args = ["run", "--bin", "build_artifacts", "${@}"]

# The `libretro` profile, not `release`: the latter sets `panic = "abort"`, which the crate rejects
# with a `compile_error!` because a panic would then take the frontend's process down.
[tasks.build-libretro]
description = "Build the libretro core"
category = "Build"
command = "cargo"
args = ["build", "--locked", "-p", "tetanes-libretro", "--profile", "libretro", "${@}"]

[tasks.test-libretro]
description = "Test the libretro core"
category = "Test"
command = "cargo"
args = ["nextest", "run", "--locked", "-p", "tetanes-libretro", "${@}"]

# A frontend resolves all twenty-five symbols and refuses the core if one is missing, so a typo in
# a `#[unsafe(no_mangle)]` name is a core that silently will not load.
[tasks.libretro-symbols]
description = "Check the libretro core exports all 25 entry points"
category = "Test"
dependencies = ["build-libretro"]
script_runner = "@shell"
script = '''
target="${CARGO_TARGET_DIR:-$HOME/.cache/cargo-target}/libretro"
case "$(uname -s)" in
  Darwin) lib="$target/libtetanes_libretro.dylib"; symbols=$(nm -gU "$lib") ;;
  *)      lib="$target/libtetanes_libretro.so";    symbols=$(nm -D --defined-only "$lib") ;;
esac
count=$(printf '%s\n' "$symbols" | grep -c ' T _\{0,1\}retro_')
printf '%s: %s exported entry points\n' "$lib" "$count"
[ "$count" -eq 25 ] || { echo "expected 25"; exit 1; }
'''

# The layout a frontend expects: the library named after the core with no `lib` prefix, and the
# `.info` beside it under the same name. Cargo cannot emit that name directly - it rejects a hyphen
# in a library target - so the rename happens here.
[tasks.libretro-artifacts]
description = "Package the libretro core for release. Takes an optional target triple"
category = "Build"
script_runner = "@shell"
script = '''
set -e
triple="${@}"
out="${CARGO_TARGET_DIR:-$HOME/.cache/cargo-target}"
if [ -n "$triple" ]; then
  cargo build --locked -p tetanes-libretro --profile libretro --target "$triple"
  out="$out/$triple/libretro"
else
  cargo build --locked -p tetanes-libretro --profile libretro
  triple=$(rustc -vV | awk '/^host:/ { print $2 }')
  out="$out/libretro"
fi

# `cdylib` is `libtetanes_libretro.so` on Linux, `.dylib` on macOS, and `tetanes_libretro.dll` on
# Windows, which is already the wanted name.
case "$triple" in
  *windows*) built="$out/tetanes_libretro.dll"; name="tetanes_libretro.dll" ;;
  *apple*)   built="$out/libtetanes_libretro.dylib"; name="tetanes_libretro.dylib" ;;
  *)         built="$out/libtetanes_libretro.so"; name="tetanes_libretro.so" ;;
esac
[ -f "$built" ] || { echo "no library at $built"; exit 1; }

stage="$out/package"
dist="tetanes-libretro/dist"
rm -rf "$stage"
mkdir -p "$stage" "$dist"
cp "$built" "$stage/$name"
cp LICENSE-MIT LICENSE-APACHE "$stage/"
# `display_version` is stamped from the crate version rather than trusted from the file, so a
# release cannot ship a `.info` announcing the version before it.
sed "s/^display_version = .*/display_version = \"${CARGO_MAKE_PROJECT_VERSION}\"/" \
  tetanes-libretro/tetanes_libretro.info > "$stage/tetanes_libretro.info"

# A zip rather than a tarball, because that is what libretro frontends and the buildbot distribute.
# The Windows runners have no `zip`, so 7-Zip stands in for it there.
archive="tetanes_libretro-${CARGO_MAKE_PROJECT_VERSION}-${triple}.zip"
abs_dist=$(cd "$dist" && pwd)
if command -v zip >/dev/null 2>&1; then
  (cd "$stage" && zip -q -r "$abs_dist/$archive" .)
elif command -v 7z >/dev/null 2>&1; then
  (cd "$stage" && 7z a -tzip -bso0 "$abs_dist/$archive" .)
else
  echo "neither zip nor 7z is available to package the core"
  exit 1
fi

# Alongside the archive and named after it, as the other release artifacts are.
case "$(uname -s)" in
  Darwin) shasum -a 256 "$dist/$archive" ;;
  *)      sha256sum "$dist/$archive" ;;
esac | awk -v n="$archive" '{ print $1 "  " n }' > "$dist/$archive-sha256.txt"
printf 'packaged %s\n' "$dist/$archive"
'''

[tasks.build-cross]
description = "Cross-Build TetaNES for a given target_arch"
category = "Build"
command = "cross"
args = ["build", "-p", "tetanes", "${@}"]

[tasks.bench]
description = "Benchmark TetaNES"
category = "Development"
command = "perf"
args = [
  "stat", "-e",
  "cycles,instructions,cache-misses,cache-references,branch-misses,branches,L1-dcache-load-misses,L1-dcache-loads",
  "taskset", "-c", "0", "cargo", "bench", "--profile", "perf", "--bench", "clock_frame", "${@}"
]

[tasks.flamegraph]
description = "Record a flamegraph of the clock_frame benchmark"
category = "Development"
command = "cargo"
args = [
  "flamegraph", "--profile", "perf", "--bench", "clock_frame",
  "--output", "target/flamegraph.svg", "--", "${@}"
]

[tasks.perf-report]
description = "Record and display a perf profile of the clock_frame benchmark"
category = "Development"
script = '''
set -e
BIN=$(cargo bench --profile perf --bench clock_frame --no-run --message-format=json 2>/dev/null \
  | grep -o '"executable":"[^"]*clock_frame[^"]*"' | tail -1 | cut -d'"' -f4)
echo "profiling $BIN"
perf record -q --call-graph dwarf -o target/perf.data "$BIN" "${@}"
perf report -i target/perf.data --no-children -g none --percent-limit 0.4 --stdio
'''

[tasks.test]
description = "Test TetaNES"
category = "Development"
command = "cargo"
args = ["nextest", "run", "--locked", "--all-features", "--no-fail-fast", "${@}"]

# `--test-threads=1` is not a preference, it is required for correctness.
#
# `tests.json` is per *directory* and holds every ROM in that group, and the harness writes the
# whole file back. nextest runs each test in its own process, so two tests in one directory that
# both need re-snapshotting read, mutate and write the same file concurrently - last writer wins,
# and the losers still report `PASS` because they did record their update before it was
# overwritten. Re-snapshotting four `apu` tests in parallel wrote exactly one of them.
[tasks.update-snapshots]
description = "Re-record ROM test snapshots (serialized; see the comment in Makefile.toml)"
category = "Development"
command = "cargo"
args = [
  "nextest", "run", "--locked", "--all-features", "--no-fail-fast",
  "--test-threads", "1", "${@}",
]
[tasks.update-snapshots.env]
UPDATE_SNAPSHOT = "1"

[tasks.run]
description = "Run TetaNES in release mode"
category = "Development"
command = "cargo"
args = ["run", "-p", "tetanes", "--release", "${@}"]

[tasks.profile]
description = "Run TetaNES in release mode w/profiling"
category = "Development"
command = "cargo"
args = ["run", "-p", "tetanes", "--release", "--features", "profiling", "${@}"]

[tasks.dev]
description = "Run TetaNES in development mode"
category = "Development"
command = "cargo"
args = ["run", "-p", "tetanes", "${@}"]

[tasks.add-wasm-target]
description = "Add wasm target"
category = "Development"
command = "rustup"
args = ["target", "add", "wasm32-unknown-unknown"]

[tasks.build-web]
description = "Build TetaNES Web"
category = "Build"
command = "trunk"
args = ["build", "--config", "tetanes/Cargo.toml", "--release", "--dist", "dist/web", "--public-url", "./"]
dependencies = ["add-wasm-target"]

[tasks.docs-web]
description = "Document TetaNES Web"
category = "Documentation"
command = "cargo"
args = ["doc", "--locked", "-p", "tetanes", "--no-deps", "--document-private-items", "--lib", "--target", "wasm32-unknown-unknown", "--all-features", "--keep-going"]
dependencies = ["add-wasm-target"]

[tasks.docs]
description = "Document TetaNES"
category = "Documentation"
command = "cargo"
args = ["doc", "--locked", "--no-deps", "--document-private-items", "--all-features", "--workspace", "--keep-going"]
dependencies = ["docs-web"]

[tasks.run-web]
description = "Run TetaNES Web in release mode"
category = "Development"
command = "trunk"
args = ["serve", "--release", "--config", "tetanes/Cargo.toml", "--address", "0.0.0.0"]
dependencies = ["add-wasm-target"]

[tasks.profile-web]
description = "Run TetaNES Web in release mode w/profiling"
category = "Development"
command = "trunk"
args = ["serve", "--release", "--features", "profiling", "--config", "tetanes/Cargo.toml", "--address", "0.0.0.0"]
dependencies = ["add-wasm-target"]

[tasks.dev-web]
description = "Run TetaNES Web in development mode"
category = "Development"
command = "trunk"
args = ["serve", "--config", "tetanes/Cargo.toml", "--address", "0.0.0.0"]
dependencies = ["add-wasm-target"]
