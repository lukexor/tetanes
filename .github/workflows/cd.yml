---
name: CD

# yamllint disable-line rule:truthy
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string
      os:
        description: "Target platform"
        required: true
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
          - web

permissions:
  contents: write

# The steps every one of these runs are in `cd-build.yml`; what differs is the target list, the
# tools and the cargo-make task. They stay one job per platform so that a dispatch can gate each on
# `inputs.os` - `jobs.<id>.if` cannot see `matrix`, so legs of a combined matrix could not be
# skipped individually - and so that a partial failure only stops the jobs downstream of the
# platform that failed.
jobs:
  build-linux:
    name: Build Linux Artifacts
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'linux')))
    uses: ./.github/workflows/cd-build.yml
    # A binary needs the glibc it was linked against or newer, so the oldest supported Ubuntu LTS
    # sets the oldest distro the Linux builds start on. The AppImage catalog rejects anything newer.
    with:
      targets: >-
        [{"target": "x86_64-unknown-linux-gnu", "runner": "ubuntu-22.04"},
        {"target": "aarch64-unknown-linux-gnu", "runner": "ubuntu-22.04-arm"}]
      tools: cargo-make,cargo-deb,cargo-pgo
      apt: true
  build-macos:
    name: Build macOS Artifacts
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'macos')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: >-
        [{"target": "x86_64-apple-darwin", "runner": "macos-latest"},
        {"target": "aarch64-apple-darwin", "runner": "macos-latest"}]
      tools: cargo-make,cargo-pgo
      cross: true
  build-windows:
    name: Build Windows Artifacts
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'windows')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: >-
        [{"target": "x86_64-pc-windows-msvc", "runner": "windows-latest"},
        {"target": "aarch64-pc-windows-msvc", "runner": "windows-11-arm"}]
      tools: cargo-make,cargo-wix,cargo-pgo
      cross: true
  build-web:
    name: Build Web Artifacts
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'web')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: '[{"target": "wasm32-unknown-unknown", "runner": "ubuntu-latest"}]'
      tools: cargo-make,trunk
      apt: true
  # No system libraries and no PGO: the core is the emulation and nothing else - no window, no
  # audio device, no input device - which is what makes it the cheapest of these to build.
  # `libretro-artifacts` takes a bare triple rather than `-- --target`, hence the empty `args`.
  build-libretro-linux:
    name: Build libretro Core (Linux)
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'linux')))
    uses: ./.github/workflows/cd-build.yml
    # Built on 22.04 for the same glibc floor as `build-linux`.
    with:
      targets: >-
        [{"target": "x86_64-unknown-linux-gnu", "runner": "ubuntu-22.04"},
        {"target": "aarch64-unknown-linux-gnu", "runner": "ubuntu-22.04-arm"}]
      tools: cargo-make
      task: libretro-artifacts
      args: ""
      path: tetanes-libretro/dist/
      suffix: libretro
  build-libretro-macos:
    name: Build libretro Core (macOS)
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'macos')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: >-
        [{"target": "x86_64-apple-darwin", "runner": "macos-latest"},
        {"target": "aarch64-apple-darwin", "runner": "macos-latest"}]
      tools: cargo-make
      task: libretro-artifacts
      args: ""
      path: tetanes-libretro/dist/
      suffix: libretro
  build-libretro-windows:
    name: Build libretro Core (Windows)
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'windows')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: '[{"target": "x86_64-pc-windows-msvc", "runner": "windows-latest"}]'
      tools: cargo-make
      task: libretro-artifacts
      args: ""
      path: tetanes-libretro/dist/
      suffix: libretro

  upload-artifacts:
    name: Attach Release Artifacts
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-macos
      - build-windows
      - build-web
      - build-libretro-linux
      - build-libretro-macos
      - build-libretro-windows
    # Whatever succeeded gets uploaded, so one platform failing costs only that platform's
    # artifacts.
    if: |
      always() && contains(needs.*.result, 'success')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # One file per call. A rejected upload then loses that asset alone, where a single call
      # passing the whole glob loses every asset it had not reached yet. An empty file marks a
      # build that failed without saying so, so the loop names it and fails the job once the
      # artifacts that did build are attached.
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          failed=()
          uploaded=()
          for file in artifacts/*; do
            if [ ! -s "$file" ]; then
              echo "::error::empty artifact: $file"
              failed+=("$file")
              continue
            fi
            if gh release upload "$RELEASE_TAG" "$file" --clobber --repo "$REPO"; then
              uploaded+=("$(basename "$file")")
            else
              echo "::error::upload failed: $file"
              failed+=("$file")
            fi
          done

          # The download table lists an artifact only when both it and its checksum were attached.
          # Everything after the marker is replaced, so a re-dispatch rewrites the table instead of
          # appending a second one.
          marker='<!-- release-artifacts -->'
          {
            echo "$marker"
            echo
            echo "### 📦 Downloads"
            echo
            echo "| Platform | Arch | Download | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            for name in "${uploaded[@]}"; do
              case "$name" in *-sha256.txt) continue ;; esac
              sum_file="artifacts/$name-sha256.txt"
              printf '%s\n' "${uploaded[@]}" | grep -qxF "$name-sha256.txt" || continue
              case "$name" in
                *aarch64* | *arm64*) arch="ARM64" ;;
                *wasm32*) arch="WASM" ;;
                *) arch="x86_64" ;;
              esac
              # The leading number is the row order: the desktop app first, then web, then libretro.
              # The link text is the kind of download rather than the file name. A 64-digit hash
              # cannot wrap, so a long file name beside it would stretch every row over several
              # lines.
              case "$name" in
                tetanes_libretro-*linux*) platform="7|libretro core (Linux)" kind="zip" ;;
                tetanes_libretro-*darwin*) platform="8|libretro core (macOS)" kind="zip" ;;
                tetanes_libretro-*windows*) platform="9|libretro core (Windows)" kind="zip" ;;
                *.AppImage) platform="0|Linux" kind="AppImage" ;;
                *.deb) platform="1|Linux" kind="Debian package" ;;
                *linux*.tar.gz) platform="2|Linux" kind="binary" ;;
                *.dmg) platform="3|macOS" kind="disk image" ;;
                *darwin*.tar.gz) platform="4|macOS" kind="binary" ;;
                *windows*.zip) platform="5|Windows" kind="MSI installer" ;;
                *wasm32*) platform="6|Web" kind="static bundle" ;;
                *) platform="99|Other" kind="$name" ;;
              esac
              # PowerShell's Get-FileHash writes uppercase hex, the other platforms lowercase.
              sum=$(awk '{ print tolower($1) }' "$sum_file")
              url="https://github.com/$REPO/releases/download/$RELEASE_TAG/$name"
              echo "$platform|$arch|[$kind]($url)|\`$sum\`"
            done | sort -t'|' -k1,1n -k3,3 | cut -d'|' -f2- | sed 's/|/ | /g; s/^/| /; s/$/ |/'
          } > table.md
          gh release view "$RELEASE_TAG" --repo "$REPO" --json body --jq .body \
            | sed "/^$marker\$/,\$d" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          { echo; cat table.md; } >> notes.md
          gh release edit "$RELEASE_TAG" --repo "$REPO" --notes-file notes.md

          if [ ${#failed[@]} -gt 0 ]; then
            echo "${#failed[@]} artifact(s) not attached: ${failed[*]}"
            exit 1
          fi
  update-tetanes-web:
    name: Update TetaNES Web
    needs: build-web
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "lukexor/lukeworks"
          token: ${{ secrets.TETANES_RELEASE_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "wasm32-unknown-unknown-artifacts"
          merge-multiple: true
      # The bundle is served from `public/` at the site root, and `index.html` names its own
      # hashed js and wasm, so the directory is replaced whole rather than merged. The light
      # scheme the framing page needs lives in `tetanes/assets/main.css` and `tetanes/index.html`,
      # so a regenerated bundle carries it and this step needs no patch of its own.
      - id: commit
        run: |
          rm -rf public/tetanes-web
          mkdir -p public/tetanes-web
          tar -xzf artifacts/*.tar.gz -C public/tetanes-web/
          VERSION=${RELEASE_TAG#"tetanes-v"}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # The directory rather than a glob: the js and wasm carry a content hash in their names,
          # so each build renames them, and `git add` stages the deletions only for a pathspec
          # that still matches a file that is gone.
          file_pattern: "public/tetanes-web"
          commit_message: Updated TetaNES Web v${{ steps.commit.outputs.version }}
  update-homebrew-formula:
    name: Update Homebrew Formula
    needs: build-macos
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "lukexor/homebrew-formulae"
          token: ${{ secrets.TETANES_RELEASE_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "*-apple-darwin-artifacts"
          merge-multiple: true
      - id: commit
        run: |
          x86_64_SHA=$(cat artifacts/*-x86_64-apple-darwin.tar.gz-sha256.txt | awk '{ print $1 }')
          aarch64_SHA=$(cat artifacts/*-aarch64-apple-darwin.tar.gz-sha256.txt | awk '{ print $1 }')
          VERSION=${RELEASE_TAG#"tetanes-v"}
          cat tetanes.rb.tmpl | \
            sed "s/%VERSION%/${VERSION}/g" | \
            sed "s/%x86_64_SHA%/${x86_64_SHA}/g" | \
            sed "s/%aarch64_SHA%/${aarch64_SHA}/g" \
            > Casks/tetanes.rb
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "*.rb"
          commit_message: Version Bump v${{ steps.commit.outputs.version }}
