---
name: CD

# yamllint disable-line rule:truthy
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string
      os:
        description: "Target platform"
        required: true
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
          - web

permissions:
  contents: write

# The steps every one of these runs are in `cd-build.yml`; what differs is the target list, the
# tools and the cargo-make task. They stay one job per platform so that a dispatch can gate each on
# `inputs.os` - `jobs.<id>.if` cannot see `matrix`, so legs of a combined matrix could not be
# skipped individually - and so that a partial failure only stops the jobs downstream of the
# platform that failed.
jobs:
  build-linux:
    name: Build Linux Artifacts
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'linux')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: >-
        [{"target": "x86_64-unknown-linux-gnu", "runner": "ubuntu-latest"},
        {"target": "aarch64-unknown-linux-gnu", "runner": "ubuntu-24.04-arm"}]
      tools: cargo-make,cargo-deb,cargo-pgo
      apt: true
  build-macos:
    name: Build macOS Artifacts
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'macos')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: >-
        [{"target": "x86_64-apple-darwin", "runner": "macos-latest"},
        {"target": "aarch64-apple-darwin", "runner": "macos-latest"}]
      tools: cargo-make,cargo-pgo
      cross: true
  build-windows:
    name: Build Windows Artifacts
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'windows')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: >-
        [{"target": "x86_64-pc-windows-msvc", "runner": "windows-latest"},
        {"target": "aarch64-pc-windows-msvc", "runner": "windows-11-arm"}]
      tools: cargo-make,cargo-wix,cargo-pgo
      cross: true
  build-web:
    name: Build Web Artifacts
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'web')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: '[{"target": "wasm32-unknown-unknown", "runner": "ubuntu-latest"}]'
      tools: cargo-make,trunk
      apt: true
  # No system libraries and no PGO: the core is the emulation and nothing else - no window, no
  # audio device, no input device - which is what makes it the cheapest of these to build.
  # `libretro-artifacts` takes a bare triple rather than `-- --target`, hence the empty `args`.
  build-libretro-linux:
    name: Build libretro Core (Linux)
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'linux')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: >-
        [{"target": "x86_64-unknown-linux-gnu", "runner": "ubuntu-latest"},
        {"target": "aarch64-unknown-linux-gnu", "runner": "ubuntu-24.04-arm"}]
      tools: cargo-make
      task: libretro-artifacts
      args: ""
      path: tetanes-libretro/dist/
      suffix: libretro
  build-libretro-macos:
    name: Build libretro Core (macOS)
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'macos')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: >-
        [{"target": "x86_64-apple-darwin", "runner": "macos-latest"},
        {"target": "aarch64-apple-darwin", "runner": "macos-latest"}]
      tools: cargo-make
      task: libretro-artifacts
      args: ""
      path: tetanes-libretro/dist/
      suffix: libretro
  build-libretro-windows:
    name: Build libretro Core (Windows)
    if: >
      ((startsWith(github.event.release.tag_name, 'tetanes')
        && !startsWith(github.event.release.tag_name, 'tetanes-core'))
      || (inputs.tag && (inputs.os == 'all' || inputs.os == 'windows')))
    uses: ./.github/workflows/cd-build.yml
    with:
      targets: '[{"target": "x86_64-pc-windows-msvc", "runner": "windows-latest"}]'
      tools: cargo-make
      task: libretro-artifacts
      args: ""
      path: tetanes-libretro/dist/
      suffix: libretro

  upload-artifacts:
    name: Attach Release Artifacts
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-macos
      - build-windows
      - build-web
      - build-libretro-linux
      - build-libretro-macos
      - build-libretro-windows
    # Whatever succeeded gets uploaded, so one platform failing costs only that platform's
    # artifacts.
    if: |
      always() && contains(needs.*.result, 'success')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name || inputs.tag }} \
            artifacts/* --clobber --repo "${{ github.repository }}"
  update-tetanes-web:
    name: Update TetaNES Web
    needs: build-web
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "lukexor/lukeworks"
          token: ${{ secrets.REPOS }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "wasm32-unknown-unknown-artifacts"
      - id: commit
        run: |
          rm -f web/public/tetanes-web/*
          tar -xzf artifacts/*.tar.gz -C web/public/tetanes-web/
          VERSION=${RELEASE_TAG#"tetanes-v"}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "web/public/tetanes-web/*"
          commit_message: Updated TetaNES Web v${{ steps.commit.outputs.version }}
  update-homebrew-formula:
    name: Update Homebrew Formula
    needs: build-macos
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "lukexor/homebrew-formulae"
          token: ${{ secrets.REPOS }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "*-apple-darwin-artifacts"
          merge-multiple: true
      - id: commit
        run: |
          x86_64_SHA=$(cat artifacts/*-x86_64-apple-darwin.tar.gz-sha256.txt | awk '{ print $1 }')
          aarch64_SHA=$(cat artifacts/*-aarch64-apple-darwin.tar.gz-sha256.txt | awk '{ print $1 }')
          VERSION=${RELEASE_TAG#"tetanes-v"}
          cat tetanes.rb.tmpl | \
            sed "s/%VERSION%/${VERSION}/g" | \
            sed "s/%x86_64_SHA%/${x86_64_SHA}/g" | \
            sed "s/%aarch64_SHA%/${aarch64_SHA}/g" \
            > Casks/tetanes.rb
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "*.rb"
          commit_message: Version Bump v${{ steps.commit.outputs.version }}
